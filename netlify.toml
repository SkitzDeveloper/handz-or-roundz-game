[build]
  command = "npm run build:netlify"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portraits/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/menu/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/Jose/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/mockv/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/skitz/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/Xtra/*"
  [headers.values]
